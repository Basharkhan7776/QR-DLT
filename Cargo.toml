[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/types",
    "crates/storage",
    "crates/mempool",
    "crates/consensus",
    "crates/network",
    "crates/node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Bashar Khan", "Zaheer Khan"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal workspace crates
qr-dlt-crypto = { path = "crates/crypto" }
qr-dlt-types = { path = "crates/types" }
qr-dlt-storage = { path = "crates/storage" }
qr-dlt-mempool = { path = "crates/mempool" }
qr-dlt-consensus = { path = "crates/consensus" }
qr-dlt-network = { path = "crates/network" }

# Serialization & Hashing
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
blake3 = "1.5"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
pqcrypto-falcon = "0.4"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
rand = "0.8"

# Concurrency & Async
rayon = "1.10"
tokio = { version = "1.40", features = ["full"] }

# Storage
sled = "0.34"

# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
